<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="One in a Computer: a reverse-trivia revision game for IB Computer Science, Biology, Chemistry, Physics, Business Management and History. Rarer correct answers take you further.">
<title>One in a Computer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one full-screen world per subject (down, up or sideways). The camera follows the answer, then the player.
   HUD on top, answer bar at the bottom, reveals in the middle. Single dark look; the accent hue follows the current layer. */
@property --hue{syntax:"<number>";inherits:true;initial-value:205}
:root{
  color-scheme:dark;
  transition:--hue .9s ease;
  --bg:#04070a;
  --panel:rgba(9,15,20,.88);
  --line:#22323d;
  --fg:#e3edf2;
  --muted:#8ea6b2;
  --hue:205;
  --accent:hsl(var(--hue) 88% 62%);
  --accent-dim:hsl(var(--hue) 70% 45% / .28);
  --you:#ff4f8b;
  --t-rootkit:#ff5470;
  --t-trojan:#ff9d2e;
  --t-blocked:#5d6d77;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}

/* ---------- world ---------- */
.viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg);transition:opacity .25s ease}
#world{position:absolute;left:0;top:0;will-change:transform}
#world.ax-down,#world.ax-up{right:0}
#world.ax-right{bottom:0}
.band{position:absolute;overflow:hidden;content-visibility:auto}
.ax-down .band,.ax-up .band{left:0;right:0}
.ax-right .band{top:0;bottom:0}
.wall{position:absolute;top:0;height:100%;width:clamp(52px,13vw,150px)}
.wall.l{left:0}.wall.r{right:0}
.hscene{position:absolute;left:0;bottom:0}
.zone{position:absolute;text-align:center;font:600 11px/1.4 var(--f-mono);letter-spacing:.3em;text-transform:uppercase;pointer-events:none}
.ax-down .zone,.ax-up .zone{left:0;right:0;padding-inline:70px}
.zone.h{width:300px;text-align:left;letter-spacing:.22em;top:58%!important}
.zone b{display:block;font:700 clamp(18px,4.4vw,26px)/1.1 var(--f-display);letter-spacing:.14em;margin-top:6px;color:#e3edf2;text-shadow:0 2px 12px #000}
.fact{position:absolute;text-align:center;font:400 11.5px/1.4 var(--f-mono);color:rgb(220 232 238 / .55);letter-spacing:.04em;pointer-events:none;text-shadow:0 1px 6px #000}
.ax-down .fact,.ax-up .fact{left:50%;transform:translateX(-50%);width:min(70%,420px)}
.fact.h{top:34%;width:230px;transform:translateX(-50%)}
.boundary{position:absolute;border:0 dashed rgb(255 255 255 / .14)}
.ax-down .boundary{left:0;right:0;top:0;border-top-width:1px}
.ax-up .boundary{left:0;right:0;bottom:0;border-bottom-width:1px}
.ax-right .boundary{top:0;bottom:0;left:0;border-left-width:1px}
.ruler{position:absolute;pointer-events:none}
.ruler text{font:500 9.5px var(--f-mono);fill:rgb(220 232 238 / .6)}
.ax-down .ruler,.ax-up .ruler{right:0;top:0;width:58px}
.ax-right .ruler{left:0;bottom:0;height:34px}
#you{position:absolute;top:0;height:0;pointer-events:none;will-change:transform}
.ax-down #you,.ax-up #you{right:0;width:70px;border-top:2px solid var(--you)}
#you span{position:absolute;font:700 10px var(--f-mono);letter-spacing:.12em;color:var(--you)}
.ax-down #you span,.ax-up #you span{right:62px;top:-9px}
.ax-right #you{top:auto;left:0;bottom:182px;width:0}
.ax-right #you span{left:-15px;top:-6px}
.ax-right #you span::after{content:" ▾"}
#virus{position:absolute;top:0;width:74px;height:74px;z-index:3;will-change:transform;filter:drop-shadow(0 0 14px hsl(var(--hue) 95% 60% / .8))}
.ax-down #virus,.ax-up #virus{left:68%}
.ax-right #virus{top:auto;left:0;bottom:84px}
#virus .bob{animation:bob 2.8s ease-in-out infinite;transform-origin:37px 37px}
#virus .vspin{animation:spin 16s linear infinite;transform-origin:0 0}
#virus.mutate .bob{animation:mutate .9s}
#virus.hit .bob{animation:hit .5s}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes mutate{0%{transform:scale(1)}35%{transform:scale(.45) rotate(-30deg)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes hit{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.flow{stroke-dasharray:7 11;animation:flow 1.1s linear infinite}
.flow.rev{animation-direction:reverse}
.flow.slow{animation-duration:2.2s}
@keyframes flow{to{stroke-dashoffset:-36}}
.blink{animation:blink 1.7s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
.drift{animation:drift 9s ease-in-out infinite}
@keyframes drift{50%{transform:translate(14px,-10px)}}
.beat{animation:beat 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes beat{15%{transform:scale(1.06)}30%{transform:scale(1)}}

/* rank lines + travelling answer */
.tline{position:absolute;height:0;opacity:0;transition:opacity .5s,filter .3s;z-index:2;pointer-events:none}
.ax-down .tline,.ax-up .tline{left:0;right:0;border-top:2px dashed var(--c)}
.tline.v{top:0;bottom:0;height:auto;width:0;border-left:2px dashed var(--c)}
.tline.on{opacity:.75}
.tline.hit{opacity:1;filter:drop-shadow(0 0 8px var(--c))}
.tline span{position:absolute;font:700 10.5px var(--f-mono);letter-spacing:.14em;color:var(--c);white-space:nowrap;text-shadow:0 0 6px #000,0 0 2px #000}
.ax-down .tline span,.ax-up .tline span{right:66px;top:-20px}
.tline.v span{left:8px}
.tline.fw{border-style:solid!important;border-color:var(--t-rootkit)!important;border-width:3px 0 0}
.tline.fw.v{border-width:0 0 0 3px}
.tline.fw span{color:var(--t-rootkit)}
#lines.quiet .tline span{opacity:0;transition:opacity .4s}
#lines.quiet .tline:not(.hit){opacity:.3}
#tag{position:absolute;top:0;z-index:4;pointer-events:none;will-change:transform}
.ax-down #tag,.ax-up #tag{left:46%}
.ax-right #tag{top:auto;left:0;bottom:0}
#tag .pill{position:relative;display:inline-flex;gap:10px;align-items:center;white-space:nowrap;max-width:76vw;overflow:hidden;text-overflow:ellipsis;
  font:700 clamp(14px,3.8vw,19px)/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tc,#7ff3ff);
  padding:11px 16px;border-radius:8px;background:rgb(4 8 11 / .84);border:1.5px solid color-mix(in srgb,var(--tc,#7ff3ff) 60%,transparent);
  box-shadow:0 0 22px color-mix(in srgb,var(--tc,#7ff3ff) 35%,transparent);text-shadow:0 0 10px color-mix(in srgb,var(--tc,#7ff3ff) 70%,transparent);transition:color .4s,border-color .4s,box-shadow .4s}
#tag.denied .pill{animation:hit .5s;--tc:#7b8b95;text-decoration:line-through}
.bits{position:absolute;left:50%;top:50%;width:0;height:0;transform:scaleY(.42)}
.bits i{position:absolute;left:0;top:0;font:700 12px var(--f-mono);font-style:normal;color:var(--pc,#5dffb0);text-shadow:0 0 6px var(--pc,#5dffb0);animation:orbit var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes orbit{from{transform:rotate(0deg) translateX(var(--r)) rotate(0deg)}to{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg)}}

/* subject-specific world pieces */
.usb{position:absolute;left:50%;transform:translateX(-50%);width:min(240px,52vw);height:64px;border-radius:6px;background:#06090b;border:3px solid #8b98a1;box-shadow:inset 0 0 0 6px #11181d}
.usb::before{content:"";position:absolute;left:12%;right:12%;top:14px;height:16px;background:#3f79b0;border-radius:2px}
.usb::after{content:"USB · ENTRY POINT";position:absolute;left:0;right:0;top:72px;text-align:center;font:600 10px var(--f-mono);letter-spacing:.2em;color:#9fb0ba}
.pins{position:absolute;left:0;right:0;height:22px;background:radial-gradient(circle,#d8b24a 0 3px,transparent 3.5px) 0 0/16px 22px;opacity:.85}
.coreglow{position:absolute;left:50%;width:120vw;max-width:1100px;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--glow,rgb(255 50 90 / .28)),transparent 62%);pointer-events:none}
.floor{position:absolute;left:0;right:0;height:420px}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--fc,#ff4f6e);box-shadow:0 0 24px var(--fc,#ff4f6e)}
.bottle{position:absolute;left:50%;transform:translateX(-50%);width:min(50vw,300px);border:3px solid rgb(210 235 255 / .38);border-top:0;border-radius:0 0 46px 46px;background:rgb(210 235 255 / .045);box-shadow:inset 0 0 50px rgb(210 235 255 / .08),0 0 30px rgb(0 0 0 / .4);pointer-events:none}
.bottle-neck{position:absolute;left:50%;transform:translateX(-50%);width:min(20vw,110px);border:3px solid rgb(210 235 255 / .38);border-bottom:0;background:rgb(210 235 255 / .045);pointer-events:none}
.cork{position:absolute;left:50%;transform:translateX(-50%);width:min(22vw,120px);height:46px;border-radius:8px 8px 4px 4px;background:repeating-linear-gradient(90deg,#9a6a3a 0 6px,#86592e 6px 12px)}
.fill{position:absolute;left:50%;transform:translateX(-50%);width:calc(min(50vw,300px) - 14px);top:calc(var(--av) + 18px);border-radius:4px 4px 40px 40px;
  background:radial-gradient(circle at 35% 35%,#ffe58a 0 7px,#d9a520 8px 10px,transparent 10.5px) 0 0/28px 24px,repeating-linear-gradient(170deg,#2e8a52 0 14px,#246f42 14px 18px,#3a9a60 18px 30px);
  box-shadow:inset 0 10px 18px rgb(255 230 140 / .35);pointer-events:none}
.fill::before{content:"";position:absolute;left:0;right:0;top:-6px;height:12px;border-radius:50%;background:#ffd85a;box-shadow:0 0 18px #ffd85a}

/* ---------- HUD ---------- */
.hud{position:fixed;top:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgb(3 5 7 / .85),transparent);padding-bottom:18px;pointer-events:none}
.hud > *{pointer-events:auto}
.box{background:rgb(6 10 13 / .82);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-width:96px}
.box small{display:block;font:600 9px var(--f-mono);letter-spacing:.18em;color:var(--muted)}
.box b{display:block;font:600 16px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.box.right{text-align:right}
.mid{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:4px;min-width:0}
.pips{display:flex;gap:4px}
.pips i{width:12px;height:12px;border-radius:2px;background:#1b2730;border:1px solid #2b3b46}
.pips i.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.pips .hp{font-size:17px;line-height:14px;color:#33414a;transition:color .4s,text-shadow .4s}
.pips .hp.on{color:#ff4f6e;text-shadow:0 0 8px rgb(255 79 110 / .7)}
.mid small{font:600 9px var(--f-mono);letter-spacing:.18em;color:var(--muted);text-transform:uppercase;text-align:center}
.menu-btn{margin-top:6px;width:34px;height:28px;border-radius:6px;border:1px solid var(--line);background:rgb(6 10 13 / .8);cursor:pointer;display:grid;place-items:center}
.menu-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.menu{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 92px);left:max(12px,env(safe-area-inset-left,0px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;backdrop-filter:blur(6px)}
.menu button{background:none;border:0;text-align:left;padding:8px 12px;border-radius:6px;cursor:pointer;font:600 13px var(--f-mono);letter-spacing:.06em}
.menu button:hover,.menu button:focus-visible{background:var(--accent-dim);outline:none}

/* ---------- prompt card + answer bar ---------- */
.card{position:fixed;z-index:15;top:calc(env(safe-area-inset-top,0px) + 92px);left:50%;transform:translateX(-50%);width:min(540px,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;backdrop-filter:blur(6px);
  box-shadow:0 10px 40px rgb(0 0 0 / .5);transition:opacity .4s cubic-bezier(.2,.7,.2,1),transform .4s cubic-bezier(.2,.7,.2,1)}
.card.out{opacity:0;transform:translate(-50%,-12px);pointer-events:none}
.card .eyebrow{font:700 10px var(--f-mono);letter-spacing:.2em;color:var(--you);text-transform:uppercase;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spec{font:600 10px var(--f-mono);letter-spacing:.08em;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.card .q{font:600 clamp(19px,4.6vw,25px)/1.25 var(--f-display);margin:8px 0 6px;text-wrap:balance;letter-spacing:.01em}
.card .hint{font:500 10.5px var(--f-mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:0}
.bar{position:fixed;z-index:16;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;justify-content:center;
  padding-top:14px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(transparent,rgb(3 5 7 / .92) 40%);transition:opacity .35s cubic-bezier(.2,.7,.2,1),transform .35s cubic-bezier(.2,.7,.2,1)}
.bar.out{opacity:0;transform:translateY(20px);pointer-events:none}
.bar form{display:flex;gap:10px;align-items:center;width:min(560px,100%)}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 15px var(--f-mono);font-variant-numeric:tabular-nums}
.ring.low b{color:var(--t-rootkit)}
.bar input{flex:1;min-width:0;font:500 16px var(--f-mono);color:var(--fg);background:rgb(6 10 13 / .9);border:1.5px solid var(--accent);border-radius:9px;padding:12px 14px}
.bar input:focus{outline:none;box-shadow:0 0 0 3px var(--accent-dim)}
.btn{appearance:none;font:700 14px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#05080a;background:var(--accent);border:0;border-radius:8px;padding:12px 18px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.inject{background:var(--you);color:#fff}
.btn.ghost{background:rgb(6 10 13 / .7);color:var(--fg);border:1.5px solid var(--line)}
.btn.descend{background:rgb(4 8 11 / .85);color:var(--accent);border:2px solid var(--accent);padding:13px 26px;box-shadow:0 0 18px var(--accent-dim)}
.countdown{position:fixed;z-index:16;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);text-align:center;font:600 11px var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.countdown b{color:var(--accent);display:inline-block;animation:tick .55s cubic-bezier(.2,.7,.2,1)}
@keyframes tick{from{transform:scale(1.7);opacity:.2}}
.leave{opacity:0!important;transform:translateY(-10px);transition:opacity .22s ease,transform .22s ease}

/* ---------- reveal ---------- */
.reveal{background:radial-gradient(ellipse 70% 55% at 50% 32%,rgb(3 5 7 / .8),transparent 75%);position:fixed;z-index:15;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 96px);bottom:96px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 12px}
.reveal > *{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.reveal > *:nth-child(2){animation-delay:.08s}.reveal > *:nth-child(3){animation-delay:.16s}.reveal > *:nth-child(4){animation-delay:.24s}.reveal > *:nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.entity{height:104px;display:grid;place-items:center}
.entity svg{filter:drop-shadow(0 0 12px var(--c));animation:bob 2.6s ease-in-out infinite;overflow:visible}
.rank{font:700 clamp(28px,8vw,48px)/1.02 var(--f-display);letter-spacing:.14em;color:var(--c);text-shadow:0 0 24px color-mix(in srgb,var(--c) 70%,transparent),0 0 2px #000;text-transform:uppercase;text-wrap:balance}
.quote{font:500 15px var(--f-mono);color:var(--fg);margin-top:4px}
.gain{font:600 14px var(--f-mono);letter-spacing:.06em;color:var(--fg)}
.gain b{color:var(--c)}
.note{font:400 12.5px/1.5 var(--f-mono);color:rgb(214 230 238 / .75);max-width:44ch}
.linkbtn{background:none;border:0;cursor:pointer;font:600 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);padding:8px;margin-top:4px}
.linkbtn:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.spectrum{width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;backdrop-filter:blur(6px)}
.spectrum ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.spectrum li{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:13px;padding:2px 6px;border-radius:5px}
.spectrum li.mine{outline:1.5px solid var(--accent);background:var(--accent-dim)}
.spectrum .lab{display:flex;gap:7px;align-items:center;min-width:0}
.spectrum .lab span{overflow-wrap:anywhere}
.spectrum .sw{width:9px;height:9px;border-radius:2px;flex:none;background:var(--c)}
.spectrum .b{height:6px;background:#1b2730;border-radius:3px;overflow:hidden}
.spectrum .b i{display:block;height:100%;background:var(--c)}
.spectrum .pc{font:400 11px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.dock{position:fixed;z-index:16;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;justify-content:center}

/* ---------- title + report overlays ---------- */
.overlay{position:fixed;inset:0;z-index:25;overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;
  padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(8px);box-shadow:0 20px 60px rgb(0 0 0 / .55)}
.sheet .eyebrow{font:700 10.5px var(--f-mono);letter-spacing:.2em;color:var(--you);text-transform:uppercase}
.sheet h1{font:700 clamp(34px,8.5vw,56px)/.95 var(--f-display);margin:4px 0 0;letter-spacing:.02em;text-wrap:balance}
.sheet h1 em{font-style:normal;color:var(--accent);text-shadow:0 0 22px var(--accent-dim)}
.lede{margin:0;color:var(--muted);font-size:15.5px;max-width:60ch}
.lede b{color:var(--fg);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:12.5px;color:var(--muted);margin:0}
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.subj{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;align-items:center;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgb(255 255 255 / .03);cursor:pointer}
.subj[aria-pressed="true"]{border-color:hsl(var(--sh) 85% 62%);background:hsl(var(--sh) 70% 45% / .2);box-shadow:0 0 0 1px hsl(var(--sh) 85% 62% / .5)}
.subj:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.subj .ic svg{width:38px;height:38px;filter:drop-shadow(0 0 6px hsl(var(--sh) 90% 60% / .6))}
.subj b{display:block;font:700 13.5px/1.2 var(--f-display);letter-spacing:.03em}
.subj small{display:block;font-size:11.5px;line-height:1.3;color:var(--muted)}
.ladder{display:flex;flex-direction:column;gap:4px}

<script>
/* ================= kit: shared helpers the subject files use ================= */
const SUBJECTS = {}, SUBJECT_ORDER = [];
const HL = true;
const P = (id, spec, q, gem, ans, traps = [], hl = false) => ({id, spec, q, gem, ans, traps, hl});
function srand(seed){ let s = seed || 1; return () => { s = (s*16807) % 2147483647; return s/2147483647; }; }
const f1 = n => Math.round(n*10)/10;
const vwall = (inner, len, side) => `<svg class="wall ${side}" viewBox="0 0 120 ${len}" preserveAspectRatio="${side==="l"?"xMinYMin":"xMaxYMin"} slice" aria-hidden="true">${inner}</svg>`;
const hscene = (inner, len, h = 420) => `<svg class="hscene" width="${len}" height="${h}" viewBox="0 0 ${len} ${h}" aria-hidden="true">${inner}</svg>`;
const SUPS = {"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
const sup = n => String(n).split("").map(c => SUPS[c] || c).join("");
const escH = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const avatarSVG = inner => `<svg width="74" height="74" viewBox="0 0 74 74" aria-hidden="true"><g class="bob"><g transform="translate(37 37)">${inner}</g></g></svg>`;
function registerSubject(s){ SUBJECTS[s.key] = s; SUBJECT_ORDER.push(s.key); }
</script>

<script>
/* ================= ranks ================= */
const TIER_BASE = {
  gem:     {pts:100, sq:"🟪", hex:"#c98bff", desc:"The hidden gem: one valid answer almost nobody thinks of", note:"The hidden gem. Almost nobody finds this one."},
  rootkit: {pts:85,  sq:"🟥", hex:"#ff5470", desc:"Under 3% of answers", note:"Very few players thought of this."},
  trojan:  {pts:60,  sq:"🟧", hex:"#ff9d2e", desc:"3–8% of answers", note:"Genuinely uncommon. Nice pull."},
  adware:  {pts:30,  sq:"🟨", hex:"#f5d042", desc:"8–18% of answers", note:"Fairly common, but not the first thing people say."},
  spam:    {pts:10,  sq:"⬜", hex:"#a9bac4", desc:"18% or more. The first thing everyone thinks of", note:"The answer everyone types first."},
  blocked: {pts:0,   sq:"⬛", hex:"#7b8b95", desc:"Not a valid answer, or out of time. You don't move", note:""},
};
const TIER_ORDER = ["gem","rootkit","trojan","adware","spam","blocked"];
const LINE_TIERS = ["spam","adware","trojan","rootkit","gem"];
const tierName = t => t==="blocked" ? M.blocked : M.tiers[t];
const tierNote = t => (M.notes && M.notes[t]) || TIER_BASE[t].note;
const TIME = 25, PRIOR = 20, PER_DIVE = 7, COUNTDOWN = 3, LIVES = 3;

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const world = $("#world"), vp = $("#vp"), ui = $("#ui");
const esc = escH;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, RM ? Math.min(ms,150) : ms));
function bezier(x1,y1,x2,y2){ const cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx, cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
  const sx=t=>((ax*t+bx)*t+cx)*t, sy=t=>((ay*t+by)*t+cy)*t, dx=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{ if (x<=0) return 0; if (x>=1) return 1; let t=x; for (let i=0;i<8;i++){ const e=sx(t)-x, d=dx(t); if (Math.abs(e)<1e-5 || Math.abs(d)<1e-6) break; t-=e/d; } return sy(Math.min(1,Math.max(0,t))); }; }
const EASE = {sink:bezier(.38,0,.16,1), move:bezier(.62,0,.3,1), soft:bezier(.4,0,.2,1)};
const easeInOut = EASE.move, CAM_K = 8;
function tween(dur, fn, ease=easeInOut){ if (RM) dur = Math.min(dur,200);
  return new Promise(res=>{ const t0=performance.now(); const step=now=>{ const k=Math.min(1,(now-t0)/dur); fn(ease(k)); if(k<1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); }); }
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

/* ================= answer matching ================= */
const normSp = s => String(s).toLowerCase().replace(/²/g,"2").replace(/³/g,"3").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/&/g," and ")
  .replace(/[^a-z0-9]+/g," ").trim().replace(/^(a|an|the) /,"");
const norm = s => normSp(s).replace(/ /g,"");
const STOP = new Set(["and","or","not","to","in","of","a","an","the","it","is","on","at"]);
function lev(a,b){ if(Math.abs(a.length-b.length)>2) return 9; const d=Array.from({length:a.length+1},(_,i)=>[i]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length]; }
for (const key of SUBJECT_ORDER) for (const p of SUBJECTS[key].prompts){
  const total = p.ans.reduce((s,a)=>s+a[1],0);
  p.list = p.ans.map(([label,w,...al]) => { const all=[label,...al];
    return {key:norm(label)||"x", label, prior:w/total, gem:label===p.gem, aliases:[...new Set(all.map(norm))], spaced:[...new Set(all.map(normSp))]}; });
  p.trapList = (p.traps||[]).map(([al,msg])=>({aliases:al.map(norm), spaced:al.map(normSp), msg}));
}
function match(p, raw){
  const n = norm(raw); if(!n) return {kind:"empty"};
  const forms = [n]; if (n.length>3 && n.endsWith("s")) forms.push(n.slice(0,-1));
  for (const f of forms){
    for (const a of p.list) if (a.aliases.includes(f)) return {kind:"ok", ans:a};
    for (const t of p.trapList) if (t.aliases.includes(f)) return {kind:"trap", msg:t.msg};
  }
  if (n.length >= 5){
    let best=null, bd=9;
    for (const a of p.list) for (const al of a.aliases){ if (al.length<5) continue; const d=lev(n,al); if(d<bd){bd=d;best=a;} }
    if (best && (bd<=1 || (bd<=2 && n.length>=8))) return {kind:"ok", ans:best, fuzzy:true};
  }
  const hay = " " + normSp(raw) + " ";
  let hit=null, hl=0;
  const consider = (sp, res) => { if (sp.length<2 || STOP.has(sp)) return; if (hay.includes(" "+sp+" ") && sp.length>hl){ hl=sp.length; hit=res; } };
  for (const a of p.list) for (const sp of a.spaced) consider(sp, {kind:"ok", ans:a, fuzzy:true});
  for (const t of p.trapList) for (const sp of t.spaced) consider(sp, {kind:"trap", msg:t.msg});
  return hit || {kind:"miss"};
}

/* ================= class stats (only where the page is hosted with a shared store) ================= */
let db=null, me=null, canWrite=false, live={}, liveTotal={}, players=0, myAns={}, statusState="loading", writeChain=Promise.resolve();
const liveCount = (pid, k) => { const m = live[pid]; return m && Object.prototype.hasOwnProperty.call(m, k) ? m[k] : 0; };
function share(p, a){ const lt=liveTotal[p.id]||0, lc=liveCount(p.id, a.key); return (a.prior*PRIOR + lc)/(PRIOR + lt); }
function tierOf(p, a){ if (a.gem) return "gem"; const s=share(p,a); return s>=.18?"spam":s>=.08?"adware":s>=.03?"trojan":"rootkit"; }
function recount(docs){
  live={}; liveTotal={}; players=0;
  for (const [id,data] of docs){
    if (id===me){ myAns = {...((data&&data.a)||{})}; continue; }
    const a = data && data.a; if (!a || typeof a!=="object") continue;
    players++;
    for (const pid in a){ const k=String(a[pid]); (live[pid]??=Object.create(null)); live[pid][k]=liveCount(pid,k)+1; liveTotal[pid]=(liveTotal[pid]||0)+1; }
  }
}
function statusHTML(){
  if (statusState==="live") return `<span class="status live"><i></i>Class stats live · ${players} other player${players===1?"":"s"}${canWrite?"":" · your answers aren't being added"}</span>`;
  if (statusState==="loading") return `<span class="status"><i></i>Checking for class stats…</span>`;
  return `<span class="status"><i></i>Rarity comes from built-in estimates of how often each answer is given.</span>`;
}
function paintStatus(){ document.querySelectorAll("[data-status]").forEach(el=>el.innerHTML=statusHTML()); }
(async()=>{
  try{
    if (!window.claude || !window.claude.use){ statusState="offline"; paintStatus(); return; }
    const [d,u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d || !u){ statusState="offline"; paintStatus(); return; }
    me = await u.id(); if (!me){ statusState="offline"; paintStatus(); return; }
    db = d; let w = null; try { w = await u.can("data.write"); } catch(e){}
    canWrite = w !== false;
    const t = setTimeout(()=>{ if(statusState==="loading"){ statusState="offline"; paintStatus(); } }, 10000);
    db.collection("subs").limit(1000).onSnapshot(snap=>{
      recount(snap.docs.map(x=>[x.id, x.data()]));
      if (!snap.metadata.fromCache){ clearTimeout(t); statusState="live"; }
      paintStatus();
    }, ()=>{ clearTimeout(t); statusState="offline"; paintStatus(); });
  }catch(e){ statusState="offline"; paintStatus(); }
})();
function record(pid, key){
  if (!db || !me || !canWrite || myAns[pid]) return;
  myAns[pid] = key;
  const body = {a:{...myAns}, t:Date.now()};
  writeChain = writeChain.then(()=>db.collection("subs").doc(me).set(body)).catch(e=>{ if (e && e.code==="invalid_argument"){ canWrite=false; paintStatus(); } });
}

/* ================= daily set ================= */
const now = new Date();
const dayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
const diveNo = Math.max(1, Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()) - Date.UTC(2026,10,23))/864e5)+1);
function rng(seed){ let h=2166136261; for (const c of seed){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } h=h||1;
  return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return (h>>>0)/4294967296; }; }
function pick(r, arr, n){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a.slice(0,n); }

/* ================= world geometry ================= */
const PX = 14, LEAD = 760, TAIL = 420, EXT = 70;
let WMAX = 760, L = LEAD + WMAX*PX + TAIL, BX = [];   // WMAX grows in endless practice; BX = bands incl. extra deep layers
let M = null, AX = "down", DIR = 1;
const isV = () => AX !== "right";
const pos = p => AX==="up" ? L - LEAD - p*PX : LEAD + p*PX;
const avPos = p => p===0 ? pos(0) - DIR*(isV()?130:150) : pos(p);
const FR = {av:{down:.42, up:.6, right:.28}, sink:{down:.46, up:.54, right:.5}, title:{down:.7, up:.45, right:.3}, land:{down:.8, up:.8, right:.5}};
const along = c => isV() ? `top:${c}px` : `left:${c}px`;
function span(a,b){ const s=Math.min(a,b), n=Math.abs(b-a); return isV() ? `top:${s}px;height:${n}px` : `left:${s}px;width:${n}px`; }
const bandFor = pts => { let i=0; BX.forEach((b,k)=>{ if(pts>=b.from) i=k; }); return i; };
function extBands(){
  const out = M.bands.map((b,i)=>({...b, d:i})), last = M.bands[M.bands.length-1];
  for (let f = 760, k = 1; f < WMAX; f += EXT, k++) out.push({...last, d:M.bands.length-1, from:f, to:f+EXT, hue:(last.hue + k*32) % 360, name:`${M.beyond||"Deeper"} ${k}`, zone:`${M.beyond||"Deeper"} · ${k}`});
  return out;
}

function buildWorld(){
  AX = M.axis; DIR = AX==="up" ? -1 : 1;
  L = LEAD + WMAX*PX + TAIL; BX = extBands();
  world.className = "ax-"+AX;
  world.style.cssText = isV() ? `height:${L}px` : `width:${L}px`;
  let h = "";
  const startSpan = AX==="up" ? span(L-LEAD, L) : span(0, LEAD);
  h += `<div class="band" style="${startSpan};background:${M.start.bg}">${M.start.deco ? M.start.deco(LEAD) : ""}</div>`;
  BX.forEach((b,i)=>{
    const a = pos(b.from), e = pos(b.to), len = Math.abs(e-a);
    const dirn = AX==="down" ? "180deg" : AX==="up" ? "0deg" : "90deg";
    h += `<div class="band" style="${span(a,e)};background:linear-gradient(${dirn},${b.bg[0]},${b.bg[1]})">${M.deco(b.d,len)}<div class="boundary" style="border-color:hsl(${b.hue} 70% 55% / .45)"></div></div>`;
  });
  const tailSpan = AX==="up" ? span(0, pos(WMAX)) : span(pos(WMAX), L);
  h += `<div class="band" style="${tailSpan};background:${M.endBg||"#020304"}"></div>`;
  // zone labels
  const startZone = AX==="down" ? `top:${LEAD-560}px` : AX==="up" ? `top:${L-LEAD+300}px` : `left:40px;top:22%`;
  h += `<div class="zone ${isV()?"":"h"}" style="${startZone};color:${M.start.color||"#6cb6ff"}">${M.start.label}<b>${esc(M.start.zone)}</b></div>`;
  BX.forEach((b,i)=>{
    const a = pos(b.from);
    const st = AX==="down" ? `top:${a+(i===0?(M.zone0||46):46)}px` : AX==="up" ? `top:${a-170}px` : `left:${a+30}px;top:22%`;
    h += `<div class="zone ${isV()?"":"h"}" style="${st};color:hsl(${b.hue} 85% 68%)">${M.meter.zone(b.from)}<b>${esc(b.zone)}</b></div>`;
  });
  M.facts.forEach(([p,t],k)=> h += `<div class="fact ${isV()?"":"h"}" style="${along(pos(p))}${isV()?"":`;top:${k%2?46:34}%`}">${esc(t)}</div>`);
  // ruler
  let ru = "";
  for (let p=0; p<=WMAX; p+=10){ const c = pos(p), big = p%50===0;
    if (isV()){ ru += `<line x1="${big?36:46}" x2="58" y1="${c}" y2="${c}" stroke="rgb(220 232 238 / ${big?.6:.28})"/>`; if (big && p>0) ru += `<text x="33" y="${c+3}" text-anchor="end">${esc(M.meter.tick(p))}</text>`; }
    else { ru += `<line y1="${big?12:22}" y2="34" x1="${c}" x2="${c}" stroke="rgb(220 232 238 / ${big?.6:.28})"/>`; if (big && p>0) ru += `<text x="${c+4}" y="10">${esc(M.meter.tick(p))}</text>`; }
  }
  h += isV() ? `<svg class="ruler" width="58" height="${L}" aria-hidden="true">${ru}</svg>` : `<svg class="ruler" width="${L}" height="34" aria-hidden="true">${ru}</svg>`;
  if (M.extras) h += M.extras({pos, L, LEAD, PX, WMAX});
  h += `<div id="lines"></div><div id="you"><span>YOU</span></div><div id="virus"></div>`;
  world.innerHTML = h;
  document.title = M.gemTitle;
}

/* ================= camera + actors ================= */
let cam = 0, camT = 0, camRAF = 0, camLast = 0, focusC = 0, focusFrac = .5, curBand = -1, avC = 0;
const vsz = () => isV() ? vp.clientHeight : vp.clientWidth;
const clampCam = v => Math.max(0, Math.min(L - vsz(), v));
function applyCam(){ world.style.transform = isV() ? `translate3d(0,${(-cam).toFixed(2)}px,0)` : `translate3d(${(-cam).toFixed(2)}px,0,0)`; }
function camStep(t){
  const dt = camLast ? Math.min(.05, (t - camLast)/1000) : 1/60; camLast = t;
  cam += (camT - cam) * (1 - Math.exp(-dt*CAM_K));
  if (Math.abs(camT - cam) < .3){ cam = camT; applyCam(); camRAF = 0; camLast = 0; return; }
  applyCam(); camRAF = requestAnimationFrame(camStep);
}
// the camera eases towards its target like a spring; instant jumps only on resets and resizes
function look(c, frac, instant){ focusC = c; if (frac!=null) focusFrac = frac; camT = clampCam(c - vsz()*focusFrac);
  if (instant || RM){ if (camRAF){ cancelAnimationFrame(camRAF); camRAF = 0; camLast = 0; } cam = camT; applyCam(); return; }
  if (!camRAF) camRAF = requestAnimationFrame(camStep); }
addEventListener("resize", () => look(focusC, focusFrac, true));
function setAvatar(c){ const v=$("#virus"), you=$("#you"); avC = c;
  if (isV()){ v.style.left = M.avX||""; v.style.transform = `translate3d(-37px,${(c-37).toFixed(2)}px,0)`; you.style.transform = `translate3d(0,${c.toFixed(2)}px,0)`; }
  else { v.style.transform = `translate3d(${(c-37).toFixed(2)}px,0,0)`; you.style.transform = `translate3d(${c.toFixed(2)}px,0,0)`; }
  world.style.setProperty("--av", c+"px"); }
function setHue(h){ document.documentElement.style.setProperty("--hue", h); }
function setBand(pts, animate){
  const b = pts===0 ? 0 : bandFor(pts);
  if (b === curBand) return false;
  curBand = b; const v=$("#virus");
  v.innerHTML = M.avatar(Math.min(b, 10), BX[b].hue); setHue(BX[b].hue);
  if (animate){ v.classList.remove("mutate"); void v.offsetWidth; v.classList.add("mutate"); }
  return true;
}

// endless practice: add deeper layers ahead of the player, keeping the view exactly where it was
function ensureWorld(need){
  if (need <= WMAX) return;
  WMAX = 760 + Math.ceil((need - 760 + 280)/EXT)*EXT;
  buildWorld(); curBand = -1; setBand(S.score, false); setAvatar(avPos(S.score)); look(avPos(S.score), FR.av[AX], true);
}
function resetWorld(){ if (WMAX !== 760){ WMAX = 760; buildWorld(); curBand = -1; } }

/* ================= HUD ================= */
function hud(at, score){ $("#hMeterLabel").textContent = M.meter.label; $("#hMeter").textContent = M.meter.fmt(at); $("#hScore").textContent = Math.round(score); }
function pips(){
  if (S && S.endless){ $("#pips").innerHTML = Array.from({length:LIVES},(_,i)=>`<b class="hp ${i<S.hearts?"on":""}" aria-label="${i<S.hearts?"heart":"lost heart"}">♥</b>`).join(""); return; }
  const n = S ? S.set.length : PER_DIVE;
  $("#pips").innerHTML = Array.from({length:n},(_,i)=>{ const r=S&&S.results[i]; return `<i class="${S&&i===S.i&&!r?"cur":""}" style="${r?`background:${TIER_BASE[r.tier].hex};border-color:${TIER_BASE[r.tier].hex}`:""}"></i>`; }).join(""); }

/* ================= reveal art ================= */
function pixel(rows, colors, px=7){ let s=""; rows.forEach((row,y)=>[...row].forEach((ch,x)=>{ if(ch===".") return; s+=`<rect x="${x*px}" y="${y*px}" width="${px}" height="${px}" fill="${colors[ch]}"/>`; }));
  const w=rows[0].length*px, h=rows.length*px; return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${s}</svg>`; }
function defaultEntity(t){
  const c = TIER_BASE[t].hex;
  if (t==="blocked") return pixel(["#########","#.......#","#.x...x.#","#..x.x..#","#...x...#","#..x.x..#",".#x...x#.","..#...#..","...###..."],{"#":c,"x":"#ff5470"},9);
  const n = {gem:5, rootkit:4, trojan:3, adware:2, spam:1}[t];
  const star = (cx,cy,r,f) => { let d=""; for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, rr=k%2?r*.45:r; d+=(k?"L":"M")+f1(cx+Math.cos(a)*rr)+" "+f1(cy+Math.sin(a)*rr); } return `<path d="${d}Z" fill="${f?c:"none"}" stroke="${c}" stroke-width="2"/>`; };
  let s=""; for (let k=0;k<5;k++) s += star(22+k*40, 30, 17, k<n);
  return `<svg width="206" height="64" viewBox="0 0 206 64">${s}</svg>`;
}

/* ================= game flow ================= */
let S = null, raf = null, flowId = 0;
function clearUI(){ ui.innerHTML = ""; const ln=$("#lines"); if (ln) ln.innerHTML = ""; const tg=$("#tag"); if (tg) tg.remove(); stopTimer(); }

/* ---------- subjects + syllabus picker ---------- */
function setMode(key){
  if (!SUBJECTS[key]) key = SUBJECT_ORDER[0];
  M = SUBJECTS[key]; store.set("oiac-mode", key); WMAX = 760;
  if (!M.topicName){ const o={}; M.catalog.forEach(th=>th.units.forEach(u=>u.topics.forEach(([c,n])=>{ o[c]=n; }))); M.topicName=o; }
  buildWorld(); curBand = -1;
}
const topicOf = p => p.spec.split(".").slice(0,2).join(".");
function getPick(){
  let st = store.get("oiac-pick-"+M.key) || (M.key==="cs" ? store.get("oiac-pick") : null);
  if (!st || !Array.isArray(st.sel) || (st.level!=="SL" && st.level!=="HL")){
    const first = M.catalog.flatMap(t=>t.units).flatMap(u=>u.topics).map(t=>t[0]).find(c=>M.prompts.some(p=>topicOf(p)===c));
    st = {level:"HL", sel:first?[first]:[]};
  }
  return st;
}
let pickState = null;
const savePick = () => store.set("oiac-pick-"+M.key, pickState);
const inLevel = p => pickState.level==="HL" || !p.hl;
const countFor = code => M.prompts.filter(p=>topicOf(p)===code && inLevel(p)).length;
const anyFor = code => M.prompts.some(p=>topicOf(p)===code);
function pool(){ const sel=new Set(pickState.sel); return M.prompts.filter(p=>sel.has(topicOf(p)) && inLevel(p)); }
function activeTopics(){ return pickState.sel.filter(c=>countFor(c)>0).sort(); }
const scopeKey = () => M.key+":"+pickState.level+":"+activeTopics().join(",");
const dailyKey = () => M.key+":"+pickState.level;
const dailyPool = () => M.prompts.filter(inLevel);
function scopeLabel(){ const t=activeTopics(); return t.length<=3 ? t.join(" + ") : `${t.length} topics`; }

function titleScreen(){
  flowId++; S = null; clearUI(); resetWorld(); curBand=-1; setBand(0,false); setAvatar(avPos(0)); look(avPos(0), FR.title[AX], true); hud(0,0); pips();
  pickState = getPick();
  $("#hPrompt").textContent = "Choose a subject";
  ui.innerHTML = `<div class="overlay" id="ov"><section class="sheet" aria-labelledby="tt">
    <div><div class="eyebrow">IB revision dive #${diveNo}</div><h1 id="tt">One in a <em>${esc(M.gemWord)}</em></h1></div>

    <div class="subjects" role="group" aria-label="Subject">${SUBJECT_ORDER.map(k=>{ const s=SUBJECTS[k]; return `<button class="subj" data-subj="${k}" aria-pressed="${k===M.key}" style="--sh:${s.bands[2].hue}"><span class="ic">${s.avatar(3, s.bands[2].hue)}</span><span><b>${esc(s.name)}</b><small>${esc(s.theme)}</small></span></button>`; }).join("")}</div>
    <p class="lede">${M.blurb}</p>
    <div class="picker" id="picker"></div>
    <details class="how"><summary>How scoring works</summary>
      <div class="ladder">${TIER_ORDER.map(t=>`<div style="--c:${TIER_BASE[t].hex}"><b>${esc(tierName(t))}</b><span class="n">+${TIER_BASE[t].pts}</span><span>${TIER_BASE[t].desc}</span></div>`).join("")}</div>
      <p class="small">${TIME} seconds per prompt, one answer each. Today's dive is ${PER_DIVE} prompts, up to ${PER_DIVE*100} points. Practice is endless until you lose all ${LIVES} hearts. Rarity comes from built-in estimates of how often each answer is given, blended with live answers where class stats are available. Small typos and short phrases are accepted.</p>
    </details>
  </section></div>`;
  $("#classBtn").onclick = () => { if (window.openClassroom) window.openClassroom(); };
  document.querySelectorAll("[data-subj]").forEach(b=> b.onclick = async () => { const k=b.dataset.subj; if (k===M.key) return; vp.style.opacity="0"; ui.style.pointerEvents="none"; await sleep(200); setMode(k); titleScreen(); ui.style.pointerEvents=""; requestAnimationFrame(()=>{ vp.style.opacity="1"; }); const f=document.querySelector(`[data-subj="${k}"]`); if (f) f.focus({preventScroll:true}); });
  renderPicker();
}

function renderPicker(focusSel){
  const el = $("#picker"); if (!el) return;
  const sel = new Set(pickState.sel), n = pool().length;
  const done = store.get("oiac6-day-"+dayStr+"-"+dailyKey()), best = store.get("oiac6-best-"+dailyKey());
  el.innerHTML = `
    <div class="pick-top">
      <div><h2 class="pick-title">Choose what to revise</h2>
        <p class="small" aria-live="polite">${n ? `Practice mix: <b>${esc(M.name)} · ${esc(scopeLabel())}</b> · ${n} prompt${n===1?"":"s"}` : "Tick at least one topic below to practise."}</p></div>
      <div class="seg" role="group" aria-label="Course level">
        <button data-lv="SL" aria-pressed="${pickState.level==="SL"}">SL</button><button data-lv="HL" aria-pressed="${pickState.level==="HL"}">HL</button></div>
    </div>
    <div class="row">
      <button class="btn" id="daily">${done?"Replay today's dive":"Today's dive"} ${M.arrow}</button>
      <button class="btn ghost" id="practice" ${n?"":"disabled"}>Practice · endless</button>
    </div>
    <p class="small"><b>Today's dive:</b> ${PER_DIVE} prompts from all of ${esc(M.name)} (${pickState.level}), the same for everyone today, up to ${PER_DIVE*100} points.${done?` Your best today: <b>${done.score}</b> pts, reached ${esc(done.layer)}.`:""}<br><b>Practice:</b> endless prompts from the topics you tick below. You have ${LIVES} hearts, and a wrong answer or running out of time costs one. Go as far as you can.${best?` Your best: <b>${best.score}</b> pts over ${best.prompts} prompts.`:""}</p>
    <span data-status>${statusHTML()}</span>
    <div class="row"><button class="mini" id="pAll">Select all</button><button class="mini" id="pNone">Clear</button></div>
    ${M.catalog.map(th=>`<div class="theme"><h3>${esc(th.label || `Theme ${th.code} · ${th.name}`)}</h3>${th.units.map(u=>{
      const codes = u.topics.map(t=>t[0]).filter(c=>countFor(c)>0);
      const all = codes.length>0 && codes.every(c=>sel.has(c));
      return `<div class="unit"><button class="unit-h" data-unit="${esc(u.code)}" aria-pressed="${all}" ${codes.length?"":"disabled"}><span>${esc(u.code)}</span>${esc(u.name)}</button>
        ${u.topics.map(([c,nm,hl])=>{ const k=countFor(c); return `<label class="topic${k?"":" off"}"><input type="checkbox" data-topic="${esc(c)}" ${sel.has(c)&&k?"checked":""} ${k?"":"disabled"}><span class="code">${esc(c)}</span><span class="nm">${esc(nm)}${hl?' <i class="hl">HL</i>':""}</span><span class="cnt">${k?k+" prompts":anyFor(c)?"HL only":"coming soon"}</span></label>`; }).join("")}</div>`; }).join("")}</div>`).join("")}`;
  const set = (codes, on) => { const s2=new Set(pickState.sel); codes.forEach(c=> on ? s2.add(c) : s2.delete(c)); pickState.sel=[...s2]; savePick(); };
  $("#daily").onclick = () => newGame(true);
  $("#practice").onclick = () => newGame(false);
  el.querySelectorAll("[data-lv]").forEach(b=> b.onclick = () => { pickState.level=b.dataset.lv; savePick(); renderPicker(`[data-lv="${b.dataset.lv}"]`); });
  $("#pAll").onclick = () => { set(Object.keys(M.topicName).filter(c=>countFor(c)>0), true); renderPicker("#pAll"); };
  $("#pNone").onclick = () => { pickState.sel=[]; savePick(); renderPicker("#pNone"); };
  el.querySelectorAll("[data-unit]").forEach(b=> b.onclick = () => {
    const u = M.catalog.flatMap(t=>t.units).find(x=>x.code===b.dataset.unit);
    const codes = u.topics.map(t=>t[0]).filter(c=>countFor(c)>0);
    set(codes, b.getAttribute("aria-pressed")!=="true"); renderPicker(`[data-unit="${u.code}"]`); });
  el.querySelectorAll("[data-topic]").forEach(cb=> cb.onchange = () => { set([cb.dataset.topic], cb.checked); renderPicker(`[data-topic="${cb.dataset.topic}"]`); });
  if (focusSel){ const f = el.querySelector(focusSel); if (f) f.focus({preventScroll:true}); }
}

function newGame(daily){
  const Pl = daily ? dailyPool() : pool(); if (!Pl.length){ titleScreen(); return; }
  flowId++;
  const set = daily ? pick(rng("oiac6"+dayStr+dailyKey()), Pl, Math.min(PER_DIVE, Pl.length)) : [];
  S = {daily, endless:!daily, pool:Pl, queue:[], hearts:LIVES, set, i:0, score:0, results:[], id:flowId,
       scope: daily ? dailyKey() : scopeKey(), label: daily ? `All topics (${pickState.level})` : scopeLabel()};
  clearUI(); resetWorld(); curBand=-1; setBand(0,false); setAvatar(avPos(0)); look(avPos(0), FR.av[AX]); hud(0,0); pips();
  showPrompt();
}

// practice draws prompts endlessly, reshuffling the mix each time it runs out
function drawPractice(){
  if (!S.queue.length){ const lastId = S.set.length ? S.set[S.set.length-1].id : null;
    S.queue = pick(rng(String(Math.random())), S.pool, S.pool.length);
    if (S.queue.length > 1 && S.queue[0].id === lastId) S.queue.push(S.queue.shift()); }
  return S.queue.shift();
}
const promptLabel = () => S.endless ? `Prompt ${S.i+1}` : `Prompt ${S.i+1} of ${S.set.length}`;
async function showPrompt(){
  if (S.endless && S.i >= S.set.length) S.set.push(drawPractice());
  if (S.endless) ensureWorld(S.score + 120);
  const id = flowId, p = S.set[S.i];
  pips(); $("#hPrompt").textContent = `${M.name} · ${S.endless ? "Practice · " : ""}${promptLabel()}`;
  ui.innerHTML = `
    <section class="card" id="card" aria-live="polite">
      <div class="eyebrow">${promptLabel()}<span class="spec">${esc(p.spec)}${p.hl?" · HL":""}</span><span style="color:var(--muted);letter-spacing:.1em">${esc(M.topicName[topicOf(p)]||"")}</span></div>
      <p class="q">${esc(p.q)}</p>
      <p class="hint">${esc(M.verbs.hint)}</p>
    </section>
    <div class="countdown" id="cd">${esc(M.verbs.count)} · the clock starts in <b id="cdn">${COUNTDOWN}</b></div>
    <div class="bar out" id="bar"><form id="f" autocomplete="off">
      <div class="ring" id="ring"><svg width="46" height="46"><circle cx="23" cy="23" r="20" fill="rgb(6 10 13 / .9)" stroke="#22323d" stroke-width="3"/><circle id="rc" cx="23" cy="23" r="20" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="125.7" stroke-dashoffset="0" stroke-linecap="round"/></svg><b id="rn">${TIME}</b></div>
      <input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type your answer" aria-label="Your answer" maxlength="80">
      <button class="btn inject" type="submit">${esc(M.verbs.inject)}</button>
    </form></div>`;
  for (let n=COUNTDOWN; n>0; n--){ if (id!==flowId) return; const el=$("#cdn"); if (el){ el.textContent=n; el.style.animation="none"; void el.offsetWidth; el.style.animation=""; } await sleep(1000); }
  if (id!==flowId) return;
  $("#cd").remove(); $("#bar").classList.remove("out");
  $("#f").onsubmit = e => { e.preventDefault(); submit(false); };
  $("#ans").focus({preventScroll:true});
  S.locked = false; startTimer();
}
function startTimer(){
  stopTimer(); const t0 = performance.now();
  const tick = () => { const left = Math.max(0, TIME - (performance.now()-t0)/1000); const rc=$("#rc"); if(!rc) return;
    rc.setAttribute("stroke-dashoffset", (125.7*(1-left/TIME)).toFixed(1)); $("#rn").textContent = Math.ceil(left); $("#ring").classList.toggle("low", left<6);
    if (left<=0){ submit(true); return; } raf = requestAnimationFrame(tick); };
  raf = requestAnimationFrame(tick);
}
function stopTimer(){ if (raf) cancelAnimationFrame(raf); raf=null; }
const pct = s => s>=.1 ? Math.round(s*100)+"%" : s>=.01 ? (s*100).toFixed(1)+"%" : "<1%";

// vertical worlds: the answer sways as it falls and settles; sideways worlds: it flies an arc and tilts along it
function placeTag(tag, c, k, arc, dist){
  if (isV()){ const damp = 1-k, sw = Math.sin(k*Math.PI*3)*16*damp, rot = -3 + Math.cos(k*Math.PI*3)*5*damp;
    tag.style.transform = `translate3d(calc(-50% + ${sw.toFixed(2)}px), calc(${c.toFixed(2)}px - 50%), 0) rotate(${rot.toFixed(2)}deg)`; }
  else { const hgt = 150 + arc*4*k*(1-k), slope = dist ? arc*4*(1-2*k)/Math.abs(dist) : 0, rot = Math.max(-30, Math.min(30, -Math.atan(slope)*57.3)) - 3;
    tag.style.transform = `translate3d(calc(${c.toFixed(2)}px - 50%), calc(${(-hgt).toFixed(2)}px + 50%), 0) rotate(${rot.toFixed(2)}deg)`; }
}
async function submit(timeout){
  if (!S || S.locked) return;
  const id = flowId, p = S.set[S.i]; const raw = $("#ans").value.trim();
  if (!raw && !timeout){ $("#ans").focus(); return; }
  S.locked = true; stopTimer(); $("#ans").blur();
  const m = raw ? match(p, raw) : {kind:"empty"};
  let tier="blocked", msg="", ans=null;
  if (m.kind==="ok"){
    ans = m.ans; tier = tierOf(p, ans); const sh = share(p, ans);
    const lc = liveCount(p.id, ans.key), lt = liveTotal[p.id]||0;
    msg = tierNote(tier) + (lt ? ` ${lc} of ${lt} classmate${lt===1?"":"s"} said this.` : ans.gem ? "" : ` About ${pct(sh)} of answers.`);
    if (m.fuzzy) msg = `Accepted as “${ans.label}”. ` + msg;
    record(p.id, ans.key);
  } else if (m.kind==="trap") msg = m.msg;
  else if (m.kind==="empty") msg = "Out of time, so you didn't move.";
  else msg = "That isn't one of the accepted answers, so you didn't move.";
  const pts = TIER_BASE[tier].pts;
  if (S.endless && tier === "blocked"){ S.hearts = Math.max(0, S.hearts - 1); msg += S.hearts ? ` You lost a heart: ${S.hearts} left.` : " That was your last heart."; }
  S.results[S.i] = {p, raw, tier, pts, msg, ans, label: ans ? ans.label : (raw || "—")};
  $("#card").classList.add("out"); $("#bar").classList.add("out");
  await sleep(350); if (id!==flowId) return;

  const base = S.score, startC = avC;
  const lines = $("#lines"); lines.classList.remove("quiet");
  lines.innerHTML = LINE_TIERS.map((t,k)=>`<div class="tline ${isV()?"":"v"}" data-t="${t}" style="--c:${TIER_BASE[t].hex};${along(pos(base+TIER_BASE[t].pts))}"><span style="${isV()?"":`top:${120+k*22}px`}">${esc(tierName(t).toUpperCase())} · ${TIER_BASE[t].pts}</span></div>`).join("")
    + `<div class="tline fw ${isV()?"":"v"}" data-t="fw" style="${along(startC + DIR*70)}"><span style="${isV()?"":"top:236px"}">${esc(M.fw)}</span></div>`;
  requestAnimationFrame(()=>lines.querySelectorAll(".tline").forEach(l=>l.classList.add("on")));

  if (m.kind==="empty"){ const v=$("#virus"); v.classList.remove("hit"); void v.offsetWidth; v.classList.add("hit"); await sleep(600); }
  else {
    const tag = document.createElement("div"); tag.id = "tag";
    const bits = Array.from({length:12},(_,k)=>`<i style="--r:${70+(k%4)*18}px;--d:${2.2+(k%5)*.5}s;--dl:${-k*.37}s">${esc(M.particles[k % M.particles.length])}</i>`).join("");
    tag.innerHTML = `<div class="bits" style="--pc:${M.particleColor||"#5dffb0"}">${bits}</div><span class="pill">“${esc(raw)}” ${M.arrow}</span>`;
    placeTag(tag, startC, 0, 0); world.appendChild(tag);
    await sleep(300); if (id!==flowId) return;
    const off = isV() ? DIR*24 : 0;
    const endC = pts>0 ? pos(base+pts) - off : startC + DIR*70 - (isV()? off : 34);
    const arc = isV() ? 0 : (M.arc ? Math.min(320, 70 + Math.abs(endC-startC)*.16) : 40);
    const lineEls = [...lines.querySelectorAll(".tline")];
    const dur = pts>0 ? 1300 + pts*30 : 700;
    await tween(dur, k=>{
      if (id!==flowId) return;
      const c = startC + (endC-startC)*k; placeTag(tag, c, k, arc, endC-startC); look(c, FR.sink[AX]);
      const lead = c + off;
      lineEls.forEach(l=>{ const lc = parseFloat(isV() ? l.style.top : l.style.left);
        if ((DIR>0 ? lead>=lc-2 : lead<=lc+2) && !l.classList.contains("hit") && (l.dataset.t!=="fw" || pts===0)){ l.classList.add("hit"); setTimeout(()=>l.classList.remove("hit"), 500); } });
    }, pts>0 ? EASE.sink : EASE.soft);
    if (id!==flowId) return;
    if (pts===0) tag.classList.add("denied");
    else { tag.style.setProperty("--tc", TIER_BASE[tier].hex); const ln = lineEls.find(l=>l.dataset.t===tier); if (ln) ln.classList.add("hit"); }
    await sleep(420); if (id!==flowId) return;
    look(endC, FR.land[AX]); await sleep(650);
  }
  if (id!==flowId) return;
  showReveal();
}

function showReveal(){
  $("#lines").classList.add("quiet");
  const r = S.results[S.i], p = r.p, t = r.tier, c = TIER_BASE[t].hex;
  const from = S.score; S.score += r.pts; hud(from, S.score); pips();
  const rows = p.list.map(a=>({a, s:share(p,a), t:tierOf(p,a)})).sort((x,y)=>(x.a.gem-y.a.gem) || (y.s-x.s));
  const max = Math.max(...rows.map(x=>x.s));
  const last = S.endless ? S.hearts <= 0 : S.i === S.set.length-1;
  const art = (M.entity && M.entity(t, c)) || defaultEntity(t);
  ui.innerHTML = `
    <section class="reveal" style="--c:${c}" aria-live="polite">
      <div class="entity" style="--c:${c}">${art}</div>
      <div class="rank">${t==="blocked" ? esc(r.raw ? M.blocked : "Timed out") : esc(tierName(t))}</div>
      <div class="quote">${r.raw ? `“${esc(r.ans ? r.ans.label : r.raw)}”` : "no answer"}</div>
      <div class="gain"><b>+${r.pts} PTS</b> · ${r.pts ? esc(M.meter.gain(from, S.score)) : "no movement"}${S.endless && !r.pts ? ` · <b style="color:#ff4f6e">−1 ♥</b>` : ""}</div>
      <div class="note">${esc(r.msg)}</div>
      <button class="linkbtn" id="specBtn" aria-expanded="false">All accepted answers ▾</button>
      <div class="spectrum" id="spec" hidden><ul>${rows.map(x=>`<li class="${r.ans && x.a.key===r.ans.key?"mine":""}" style="--c:${TIER_BASE[x.t].hex}"><span class="lab"><i class="sw"></i><span>${esc(x.a.label)}${x.a.gem?" · <b>gem</b>":""}</span></span><span class="b"><i style="width:${x.a.gem?3:Math.max(3,x.s/max*100)}%"></i></span><span class="pc">${x.a.gem?"gem":pct(x.s)}</span></li>`).join("")}</ul></div>
    </section>
    <div class="dock"><button class="btn descend" id="go">${r.pts ? esc(M.verbs.cta) : (last ? "Results" : "Next prompt")}</button></div>`;
  $("#specBtn").onclick = e => { const sp=$("#spec"); sp.hidden=!sp.hidden; e.currentTarget.setAttribute("aria-expanded", String(!sp.hidden)); e.currentTarget.textContent = sp.hidden ? "All accepted answers ▾" : "Hide answers ▴"; };
  $("#go").onclick = descend; $("#go").focus({preventScroll:true});
}

async function descend(){
  const id = flowId, r = S.results[S.i];
  const go = $("#go"); if (go) go.disabled = true;
  document.querySelectorAll(".reveal,.dock").forEach(e=>e.classList.add("leave")); await sleep(230); if (id!==flowId) return;
  ui.innerHTML = "";
  const tg = $("#tag"); if (tg){ tg.style.transition="opacity .5s"; tg.style.opacity="0"; setTimeout(()=>tg.remove(),500); }
  $("#lines").querySelectorAll(".tline").forEach(l=>l.classList.remove("on"));
  const from = S.score - r.pts, to = S.score;
  if (r.pts > 0){
    const c0 = avPos(from), c1 = avPos(to);
    await tween(900 + r.pts*16, k=>{ if (id!==flowId) return; const c = c0+(c1-c0)*k, pnow = from + (to-from)*k; setAvatar(c); look(c, FR.av[AX]); hud(pnow, S.score); setBand(pnow, true); }, EASE.move);
    if (id!==flowId) return;
  } else look(avC, FR.av[AX]);
  $("#lines").innerHTML = "";
  S.i++;
  if (S.endless ? S.hearts <= 0 : S.i >= S.set.length) report(); else showPrompt();
}

function report(){
  const b = bandFor(S.score), where = S.score===0 ? M.start.zone : BX[b].name, n = S.results.length;
  const counts = {}; S.results.forEach(r=>counts[r.tier]=(counts[r.tier]||0)+1);
  const shareText = `One in a ${M.gemWord} · ${M.name} ${S.label} · ${S.daily?"Dive #"+diveNo:`Practice · ${n} prompts`}\n${M.emoji} ${S.score} pts · ${M.meter.fmt(S.score)} · reached ${where}\n${S.results.map(r=>TIER_BASE[r.tier].sq).join("")}`;
  let newBest = false;
  if (S.daily){ const dk = "oiac6-day-"+dayStr+"-"+S.scope; const prev = store.get(dk); if (!prev || S.score>prev.score) store.set(dk, {score:S.score, layer:where}); }
  else { const bk = "oiac6-best-"+M.key+":"+pickState.level, prev = store.get(bk); if (!prev || S.score>prev.score){ store.set(bk, {score:S.score, prompts:n}); newBest = S.score > 0; } }
  $("#hPrompt").textContent = "Dive complete";
  ui.innerHTML = `<div class="overlay"><section class="sheet" aria-labelledby="rt">
    <div><div class="eyebrow">${esc(M.name)} report · ${esc(S.label)} · ${S.daily?"Dive #"+diveNo:"Practice"}${newBest?" · new best!":""}</div><h1 id="rt">${S.endless ? "Out of hearts at" : "Reached"} <em>${esc(where)}</em></h1></div>
    <div class="stats3"><div><b>${S.score}</b><span>Points${S.daily?` / ${PER_DIVE*100}`:""}</span></div><div><b>${esc(M.meter.fmt(S.score))}</b><span>${esc(M.meter.label.toLowerCase())}</span></div>${S.endless ? `<div><b>${n}</b><span>Prompts answered</span></div>` : `<div><b>${(counts.gem||0)+(counts.rootkit||0)}</b><span>${esc(tierName("rootkit"))} or better</span></div>`}</div>
    <div class="recap">${S.results.map(r=>`<div style="--c:${TIER_BASE[r.tier].hex}"><span class="p"><span class="spec">${esc(r.p.spec)}</span> ${esc(r.p.q)}</span><span class="t">${esc(tierName(r.tier))}<small>+${r.pts}</small></span><span class="a">${esc(r.label)}</span></div>`).join("")}</div>
    <pre class="share" id="sharetext">${esc(shareText)}</pre>
    <div class="row"><button class="btn" id="copy">Copy result</button><span class="small" id="copied" aria-live="polite"></span></div>
    <div class="row"><button class="btn ghost" id="again">${S.endless ? "Practise again" : "Practice · endless"}</button><button class="btn ghost" id="surface">Back to the start</button></div>
  </section></div>`;
  $("#copy").onclick = () => {
    const ok = () => $("#copied").textContent = "Copied. Paste it in your class chat.";
    const fallback = () => { const rg=document.createRange(); rg.selectNodeContents($("#sharetext")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rg); $("#copied").textContent="Selected. Press Ctrl+C or ⌘C to copy."; };
    try { navigator.clipboard.writeText(shareText).then(ok, fallback); } catch(e){ fallback(); }
  };
  $("#again").onclick = () => newGame(false);
  $("#surface").onclick = async () => { ui.innerHTML=""; const c0=focusC, f0=focusFrac, c1=avPos(0); await tween(1700, k=>look(c0+(c1-c0)*k, f0+(FR.title[AX]-f0)*k), EASE.move); await sleep(250); titleScreen(); };
}

/* ================= menu ================= */
$("#menuBtn").onclick = () => { const m=$("#menu"); m.hidden=!m.hidden; $("#menuBtn").setAttribute("aria-expanded", String(!m.hidden)); };
$("#mTitle").onclick = () => { $("#menu").hidden=true; titleScreen(); };
$("#mClass").onclick = () => { $("#menu").hidden=true; if (window.openClassroom) window.openClassroom(); };
$("#mRestart").onclick = () => { $("#menu").hidden=true; if (S) newGame(S.daily); else newGame(false); };

setMode(store.get("oiac-mode") || "cs");
titleScreen();
</script>
<script src="vendor/peerjs.min.js"></script>
<script src="classroom.js"></script>
</body>
</html>
